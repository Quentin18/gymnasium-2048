[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "gymnasium_2048"
version = "0.1.2"
authors = [
    { name = "Quentin Deschamps", email = "quentindeschamps18@gmail.com" },
]
description = "A reinforcement learning environment for the 2048 game based on Gymnasium"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["2048", "Reinforcement Learning", "game", "RL", "AI", "gymnasium", "pygame"]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium==1.3.0",
    "numpy>=1.22.0",
    "pygame==2.6.1",
]

[project.optional-dependencies]
training = [
    "matplotlib>=3.10.0",
    "moviepy==2.2.1",
    "pandas>=2.3.0",
    "tqdm==4.70.0",
]
testing = ["pytest"]
quality = ["ruff", "ty"]

[project.urls]
Repository = "https://github.com/Quentin18/gymnasium-2048"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
    "PL", # pylint
    "RUF",
]
ignore = [
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"src/gymnasium_2048/envs/twenty_forty_eight.py" = ["RUF012"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
